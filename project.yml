name: NewsTracker
options:
  bundleIdPrefix: com.example.newstracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  NewsCore:
    path: NewsCore

targets:
  NewsTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NewsTrackerApp
    info:
      # Generated by XcodeGen; merged with the keys generated by Xcode (GENERATE_INFOPLIST_FILE).
      path: NewsTrackerApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.newstracker.pricecheck
    dependencies:
      - package: NewsCore
        product: NewsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.newstracker.app
        PRODUCT_NAME: NewsTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: News Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer Team ID locally in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""

schemes:
  NewsTracker:
    build:
      targets:
        NewsTracker: all
    run:
      config: Debug
